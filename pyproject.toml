[project]
name = "agentic-search"
version = "0.1.0"
description = "Multi-agent agentic search system with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.3",
    "langchain-tavily>=0.1",
    "langchain-community>=0.3",
    "volcengine-python-sdk[ark]>=5.0",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "arxiv>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.2",
    "sse-starlette>=2.0",
    "rank-bm25>=0.2.2",
    "click>=8.0",
]

[project.scripts]
agentic-search = "agentic_search.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_search"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
